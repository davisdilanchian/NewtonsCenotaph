<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Cénotaphe de Newton</title>
<meta name="description" content="Walk through Étienne-Louis Boullée's unbuilt 1784 monument to Isaac Newton, modelled to scale from his drawings.">
<style>
  :root { --ink: #f2ece0; --dim: rgba(242, 236, 224, .62); --line: rgba(242, 236, 224, .24); --bg: #0c0f14;
          --serif: Didot, "Bodoni 72", "Iowan Old Style", Georgia, serif; --sans: -apple-system, "Helvetica Neue", Arial, sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--sans);
               -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { position: fixed; inset: 0; display: block; touch-action: none; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }

  /* title screen */
  #intro { position: fixed; inset: 0; z-index: 10; display: grid; align-content: safe center; justify-items: center; gap: 20px; padding: 24px;
           overflow-y: auto; text-align: center; background: var(--bg); transition: opacity .7s ease; }
  #intro.gone { opacity: 0; pointer-events: none; }
  #sheets { --w: min(640px, 92vw, 56vh); width: var(--w); margin: 0; display: grid; gap: 8px; }
  #sheet { position: relative; aspect-ratio: 1.64; }
  #sheet img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0; filter: grayscale(.3) brightness(.92); transition: opacity .9s ease; }
  #sheet img.on { opacity: 1; }
  #sheets figcaption { min-height: 1.3em; color: var(--dim); font-size: 13px; }
  #thumbs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  #thumbs button { aspect-ratio: 1.64; overflow: hidden; opacity: .5; outline: 1px solid transparent; outline-offset: 1px; transition: opacity .2s, outline-color .2s; }
  #thumbs button:hover, #thumbs button:focus-visible { opacity: .85; }
  #thumbs button[aria-pressed="true"] { opacity: 1; outline-color: var(--ink); }
  #thumbs img { display: block; width: 100%; height: 100%; object-fit: cover; filter: grayscale(.3); }
  #intro h1 { margin: 0; font: 400 clamp(32px, 6vw, 58px)/1.05 var(--serif); letter-spacing: .01em; }
  #intro p { margin: 0; max-width: 54ch; color: var(--dim); font-size: 15px; line-height: 1.55; }
  #bar { width: min(320px, 70vw); height: 1px; background: var(--line); }
  #bar i { display: block; height: 100%; width: 0; background: var(--ink); transition: width .25s; }
  #enter { padding: 12px 34px; border: 1px solid var(--ink); font: 400 19px var(--serif); letter-spacing: .04em; transition: background .2s, color .2s; }
  #enter:hover, #enter:focus-visible { background: var(--ink); color: var(--bg); outline: none; }
  #enter[hidden] { display: none; }
  #err { color: #f0a58c; max-width: 50ch; font-size: 14px; }

  /* in-world interface */
  #hud { position: fixed; inset: 0; z-index: 5; pointer-events: none; opacity: 0; transition: opacity .6s; font-size: 13px; text-shadow: 0 1px 2px rgba(0, 0, 0, .75), 0 0 10px rgba(0, 0, 0, .45); }
  #hud.on { opacity: 1; }
  #where { position: absolute; left: 22px; top: 18px; font: 400 21px var(--serif); }
  #where small { display: block; margin-top: 3px; font: 400 12.5px var(--sans); color: var(--ink); opacity: .78; }
  #places, #where { background: rgba(12, 15, 20, .3); border-radius: 3px; }
  #where { padding: 6px 10px; }
  #places { position: absolute; right: 14px; top: 14px; padding: 5px 7px; display: grid; gap: 2px; justify-items: end; pointer-events: auto; }
  #places button { padding: 3px 4px; opacity: .78; transition: opacity .15s; }
  #places button:hover, #places button:focus-visible { opacity: 1; outline: none; text-decoration: underline; text-underline-offset: 3px; }
  #places kbd { font: inherit; opacity: .6; margin-left: 7px; }
  #keys { position: absolute; left: 22px; bottom: 18px; line-height: 1.75; opacity: .82; transition: opacity 1s; }
  #keys.faded { opacity: 0; }
  #keys b { font-weight: 500; }

  /* touch */
  #stick, #jump { position: absolute; display: none; pointer-events: auto; touch-action: none; border: 1px solid rgba(255, 255, 255, .55);
                         border-radius: 50%; background: rgba(12, 15, 20, .22); }
  #stick { left: 26px; bottom: 30px; width: 122px; height: 122px; }
  #stick i { position: absolute; left: 50%; top: 50%; width: 50px; height: 50px; margin: -25px; border-radius: 50%; background: rgba(255, 255, 255, .6); }
  #jump { right: 26px; bottom: 34px; width: 66px; height: 66px; color: #fff; font-size: 12px; }
  .touch #stick, .touch #jump { display: block; }
  .touch #keys { display: none; }
  @media (max-width: 720px) { #places { font-size: 12px; right: 10px; top: 10px; } #where { font-size: 17px; left: 14px; top: 12px; max-width: 42vw; } #where small { display: none; } }
</style>
</head>
<body>
<div id="intro">
  <figure id="sheets">
    <div id="sheet"></div>
    <figcaption id="sheetName"></figcaption>
    <div id="thumbs" role="group" aria-label="Boullée's drawings"></div>
  </figure>
  <h1>Cénotaphe de Newton</h1>
  <p id="about">Étienne-Louis Boullée drew this sphere for Isaac Newton in 1784. It was never built.</p>
  <div id="bar"><i></i></div>
  <button id="enter" hidden>Enter</button>
  <div id="err" hidden></div>
</div>
<div id="hud">
  <div id="where"><span id="whereName"></span><small id="whereNote"></small></div>
  <nav id="places" aria-label="Go to a place"></nav>
  <div id="keys"><b>WASD</b> walk &nbsp;·&nbsp; <b>Shift</b> run &nbsp;·&nbsp; <b>Space</b> jump &nbsp;·&nbsp; <b>Mouse</b> look &nbsp;·&nbsp; <b>Esc</b> free the cursor</div>
  <div id="stick"><i></i></div>
  <button id="jump">Jump</button>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
